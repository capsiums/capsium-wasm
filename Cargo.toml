[package]
name = "capsium-core"
version = "0.1.0"
edition = "2021"
description = "Capsium core: package model, integrity verification, route resolution. Single source of truth for every host reactor."
license = "MIT"
repository = "https://github.com/capsiums/capsium-wasm"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"

[dev-dependencies]
wasm-bindgen-test = "0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
