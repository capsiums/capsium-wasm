[package]
name = "capsium-core"
version = "0.1.0"
edition = "2021"
description = "Capsium core: package model, integrity verification, route resolution. Single source of truth for every host reactor."
license = "MIT"
repository = "https://github.com/capsiums/capsium-wasm"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"

# WASM bindings (optional so the rlib builds without them when a host
# links capsium-core directly as a Rust crate). Enabled via the
# `wasm` feature for `wasm-pack build --target web`.
wasm-bindgen = { version = "0.2.88", optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }

[features]
default = []
wasm = ["dep:wasm-bindgen", "dep:serde-wasm-bindgen"]

[dev-dependencies]
wasm-bindgen-test = "0.3"
js-sys = "0.3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
